<main class="login-page">
  <section class="login-card">
    <h1>ClinicApp</h1>
    <p class="subtitulo">Gestión de inventario clínico</p>

    <label for="correo">Correo</label>
    <input
      id="correo"
      type="email"
      placeholder="usuario@correo.com"
      [(ngModel)]="correo"
    />

    <label for="contrasena">Contraseña</label>
    <div class="campo-contrasena">
      <input
        id="contrasena"
        [type]="contrasenaVisible() ? 'text' : 'password'"
        placeholder="••••••••"
        [(ngModel)]="contrasena"
      />
      <button
        type="button"
        class="boton-ojo"
        (click)="alternarContrasena()"
        [attr.aria-label]="contrasenaVisible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        [title]="contrasenaVisible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
      >
        @if (contrasenaVisible()) {
          <!-- Ojo tachado: la contraseña está visible, al pulsar se oculta -->
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
            <line x1="1" y1="1" x2="23" y2="23" />
          </svg>
        } @else {
          <!-- Ojo abierto: la contraseña está oculta, al pulsar se muestra -->
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        }
      </button>
    </div>

    <button (click)="onSubmit()" [disabled]="cargando()">
      {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
    </button>

    @if (mensaje()) {
      <p class="mensaje" [class.exito]="loginExitoso()" [class.error]="!loginExitoso()">
        {{ mensaje() }}
      </p>
    }
  </section>
</main>
